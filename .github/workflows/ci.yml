name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Check formatting
        run: test -z "$(find cmd internal -name '*.go' -type f -exec gofmt -l {} +)"

      - name: Run Go tests
        run: go test ./...

      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node scripts/check-i18n.mjs
          node scripts/test-web-language.mjs
          node scripts/test-home-ui.mjs
          node scripts/test-settings-ui.mjs

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh packaging/raw/usr/libexec/zima-display/start-renderer internal/boot/recover-extension.sh; do
            sh -n "$script"
          done

      - name: Test renderer fallback
        run: ./scripts/test-renderer-fallback.sh

      - name: Build native package
        run: ./scripts/build.sh amd64

      - name: Test native package
        run: ./scripts/test-package.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zima-display-amd64
          path: |
            dist/zima-display.raw
            dist/zima-display-stage.tar.gz
